# Tests Max on every change, then deploys Max's backend (worker.js) to Cloudflare — only if all tests pass.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (a token that can deploy only this Worker).
# Settings come from wrangler.jsonc. Secrets in Cloudflare (GEMINI_API_KEY, MAX_PASSCODE) are not touched.
name: Deploy Max backend

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Run all Max tests
        run: bash tests/run.sh

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fe65b997a30f62c013810d5ecb34f4ca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Worker code loads
        run: node -e "import('./worker.js').then(()=>console.log('worker.js OK'))"
      - name: Check the deploy key is present
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Accept the key even if extra text was pasted with it (labels, quotes, "Bearer", the account ID line).
          tok=$(printf '%s\n' "$RAW_TOKEN" | sed -E 's/\r//g; s/^[[:space:]]*(export[[:space:]]+)?(CLOUDFLARE_API_TOKEN|API_TOKEN|TOKEN|apiToken)[[:space:]]*[:=][[:space:]]*//I; s/^[[:space:]]*Bearer[[:space:]]+//I; s/["'\''`,;]//g; s/^[[:space:]]+|[[:space:]]+$//g' \
            | grep -vE '^(CLOUDFLARE_)?ACCOUNT_ID|^fe65b997a30f62c013810d5ecb34f4ca$' | grep -E '^[A-Za-z0-9_-]{30,}$' | awk '{ print length, $0 }' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$tok" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret does not contain a Cloudflare key. Paste only the key (one long code, no spaces)."
            # Describe what was saved without revealing it: length and kinds of characters per line.
            printf '%s\n' "$RAW_TOKEN" | while IFS= read -r l; do
              kinds=$(printf '%s' "$l" | sed -E 's/[A-Za-z]/a/g; s/[0-9]/9/g; s/ /_SPACE_/g' | fold -w1 | sort -u | tr -d '\n')
              echo "::warning::saved line: ${#l} characters, character kinds: $kinds"
            done
            exit 1
          fi
          lines=$(printf '%s\n' "$RAW_TOKEN" | grep -c . || true)
          echo "::notice::Deploy key found (${#tok} characters; the secret had $lines line(s))."
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
      - name: Deploy to Cloudflare
        run: |
          set -o pipefail
          # Try the newest wrangler, then a few known-older ones; retry briefly on Cloudflare hiccups.
          latest=$(npm view wrangler@4 version 2>/dev/null | tail -1 | sed -E "s/.*'([0-9.]+)'.*/\1/")
          older=$(npm view wrangler versions --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s).filter(x=>/^4\.\d+\.\d+$/.test(x));const minors=[...new Set(v.map(x=>x.split('.').slice(0,2).join('.')))];const pick=minors.slice(-2,-1).reverse().map(m=>v.filter(x=>x.startsWith(m+'.')).pop());console.log(pick.join(' '))})")
          echo "::notice::wrangler versions to try: ${latest:-4} ${older}"
          ok=0
          for ver in ${latest:-4} ${older}; do
            for attempt in 1; do
              if npx --yes wrangler@$ver deploy > deploy.log 2>&1; then ok=1; echo "::notice::Deployed with wrangler $ver"; break 2; fi
              echo "::warning::wrangler $ver attempt $attempt: $(grep -E 'ERROR|✘' deploy.log | head -1 | sed 's/\x1b\[[0-9;]*m//g')"
              sleep 15
            done
          done
          if [ $ok -ne 1 ]; then
            # Backup route: upload straight to Cloudflare's script API (needs only "edit this Worker").
            # Keeps all secrets and text variables set in the dashboard; binds the MAX_MEMORY database.
            echo "::warning::wrangler could not deploy; uploading directly to Cloudflare instead."
            node -e '
              const fs=require("fs"),j=fs.readFileSync("wrangler.jsonc","utf8").replace(/^\s*\/\/.*$/gm,"");const c=JSON.parse(j);
              fs.writeFileSync("metadata.json",JSON.stringify({main_module:c.main,compatibility_date:c.compatibility_date,
                bindings:(c.d1_databases||[]).map(d=>({type:"d1",name:d.binding,id:d.database_id})),
                keep_bindings:["secret_text","plain_text","secret_key"],observability:c.observability||{enabled:true}}));'
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/max-ai-backend" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -F "metadata=@metadata.json;type=application/json" \
              -F "worker.js=@worker.js;type=application/javascript+module" > upload.json || true
            if node -e 'const r=JSON.parse(require("fs").readFileSync("upload.json","utf8"));if(!r.success){for(const e of r.errors||[])console.log("::error::Cloudflare: "+e.code+" "+e.message);process.exit(1)}console.log("::notice::Uploaded directly to Cloudflare (script API)")'; then ok=1; fi
          fi
          if [ $ok -ne 1 ]; then
            grep -iE "error|✘|failed|authentication|permission|not found|code: [0-9]+" deploy.log | grep -v "CLOUDFLARE_API_TOKEN" | head -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat deploy.log 2>/dev/null || true
          grep -E "Uploaded|Deployed|https://|Current Version" deploy.log | while IFS= read -r line; do echo "::notice::$line"; done
      - name: Check the live Worker
        run: |
          sleep 5
          out=$(curl -fsS https://max-ai-backend.mjgaly-mg.workers.dev/health)
          echo "$out"
          echo "::notice::health: $out"
