# Deploys Max's backend (worker.js) to Cloudflare whenever it changes on main.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (a token that can deploy only this Worker).
# Settings come from wrangler.jsonc. Secrets in Cloudflare (GEMINI_API_KEY, MAX_PASSCODE) are not touched.
name: Deploy Max backend

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.jsonc
  workflow_dispatch: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fe65b997a30f62c013810d5ecb34f4ca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Worker code loads
        run: node -e "import('./worker.js').then(()=>console.log('worker.js OK'))"
      - name: Check the deploy key is present
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Accept the key even if extra text was pasted with it (labels, quotes, "Bearer", the account ID line).
          tok=$(printf '%s\n' "$RAW_TOKEN" | sed -E 's/\r//g; s/^[[:space:]]*(export[[:space:]]+)?(CLOUDFLARE_API_TOKEN|API_TOKEN|TOKEN|apiToken)[[:space:]]*[:=][[:space:]]*//I; s/^[[:space:]]*Bearer[[:space:]]+//I; s/["'\''`,;]//g; s/^[[:space:]]+|[[:space:]]+$//g' \
            | grep -vE '^(CLOUDFLARE_)?ACCOUNT_ID|^fe65b997a30f62c013810d5ecb34f4ca$' | grep -E '^[A-Za-z0-9_-]{30,}$' | awk '{ print length, $0 }' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$tok" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret does not contain a Cloudflare key. Paste only the key (one long code, no spaces)."
            # Describe what was saved without revealing it: length and kinds of characters per line.
            printf '%s\n' "$RAW_TOKEN" | while IFS= read -r l; do
              kinds=$(printf '%s' "$l" | sed -E 's/[A-Za-z]/a/g; s/[0-9]/9/g; s/ /_SPACE_/g' | fold -w1 | sort -u | tr -d '\n')
              echo "::warning::saved line: ${#l} characters, character kinds: $kinds"
            done
            exit 1
          fi
          lines=$(printf '%s\n' "$RAW_TOKEN" | grep -c . || true)
          echo "::notice::Deploy key found (${#tok} characters; the secret had $lines line(s))."
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
      - name: Deploy to Cloudflare
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log || {
            # Show the reason as annotations so it can be read without opening the log.
            grep -iE "error|✘|failed|authentication|permission|not found|code: [0-9]+" deploy.log | grep -v "CLOUDFLARE_API_TOKEN" | head -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          grep -E "Uploaded|Deployed|https://|Current Version" deploy.log | while IFS= read -r line; do echo "::notice::$line"; done
      - name: Check the live Worker
        run: |
          sleep 5
          out=$(curl -fsS https://max-ai-backend.mjgaly-mg.workers.dev/health)
          echo "$out"
          echo "::notice::health: $out"
