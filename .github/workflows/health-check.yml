name: Check Max's server
# Reads Max's public health page (no secrets) so progress can be checked from anywhere.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the health page
        run: |
          curl -fsS "https://max-ai-backend.mjgaly-mg.workers.dev/health" > health.json
          node -e 'const h=require("./health.json");console.log("version="+h.version);console.log("reportsNow="+(h.reportsNow||"?"));console.log("guard="+(h.guard||"?"));console.log("coreNotes="+(h.coreNotes||"?"))'
